services:
  site:
    build: .
    image: ghcr.io/maselkov/gw2bot-site:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      MONGO_HOST: ${MONGO_HOST:-host.docker.internal}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_DB: ${MONGO_DB:-gw2bot}
    extra_hosts:
      - "host.docker.internal:host-gateway"
