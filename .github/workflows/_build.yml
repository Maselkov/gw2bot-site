name: Build image

# Lints, then builds ghcr.io/<owner>/gw2bot-site:<sha>. An image that was
# already pushed for this commit (e.g. by CI on master) is reused, so prod
# gets the exact image that CI built.
on:
  workflow_call:
    inputs:
      push:
        description: Push the image (off for pull requests)
        type: boolean
        default: true
      tags:
        description: Extra tags for the image, space-separated
        type: string
        default: ""
    outputs:
      image:
        value: ${{ jobs.build.outputs.image }}

jobs:
  lint:
    runs-on: ubuntu-latest
    container: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      # GHCR rejects uppercase in image names
      - name: Image name
        id: name
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gw2bot-site"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing image
        id: existing
        if: inputs.push
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v7
        if: steps.existing.outputs.found != 'true'
        with:
          context: .
          push: ${{ inputs.push }}
          tags: ${{ steps.name.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Add tags
        if: inputs.push && inputs.tags != ''
        env:
          REPO: ${{ steps.name.outputs.repo }}
          IMAGE: ${{ steps.name.outputs.image }}
          EXTRA_TAGS: ${{ inputs.tags }}
        run: |
          read -ra tags <<< "$EXTRA_TAGS"
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$REPO:$tag"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE"
